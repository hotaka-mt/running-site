<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ランニング記録</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>ランニング記録</h1>
    <main>
        <section>
            <h2>今日の体調</h2>
            <form id="condition-form">
                <div>
                    <label for="fatigue">
                        疲労度:
                        <output id="fatigue-value">0</output>
                    </label>

                    <input type="range" id="fatigue" name="fatigue" min="0" max="10" value="0">
                </div>

                <fieldset>
                    <legend>筋肉痛</legend>

                    <label>
                        <input type="radio" name="musule-plan" value="none" checked>
                        なし
                    </label>

                    <label>
                        <input type="radio" name="musule-plan" value="light">
                        軽い
                    </label>

                    <label>
                        <input type="radio" name="musule-plan" value="strong">
                        強い
                    </label>
                </fieldset>


                <fieldset>
                    <legend>睡眠</legend>

                    <label>
                        <input type="radio" name="sleep" value="good" checked>
                        良い
                    </label>

                    <label>
                        <input type="radio" name="sleep" value="normal">
                        普通
                    </label>

                    <label>
                        <input type="radio" name="sleep" value="bad">
                        悪い
                    </label>
                </fieldset>

                <button type="submit">記録する</button>
            </form>
        </section>
        <section>
            <h2>現在の目標</h2>
            <p> 10kmを50分で走ること</p>
        </section>
    </main>
</body>

</html>
